name: Bug report
description: Something in Kalypt is not behaving as expected.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this. Please avoid attaching private or sensitive files; a minimal synthetic sample is better whenever possible.
  - type: input
    id: version
    attributes:
      label: Kalypt version
      placeholder: 0.3.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the command or UI action, expected behavior, and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Steps or a minimal synthetic fixture that reproduces the problem.
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Redact credentials, personal data, local paths, or anything else you do not want public.
      render: shell
