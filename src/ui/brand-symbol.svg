<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Kalypt symbol</title>
  <desc id="desc">Layered charcoal aperture opening to a cyan center.</desc>
