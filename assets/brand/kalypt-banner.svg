    <radialGradient id="core"><stop stop-color="#4bf5ff"/><stop offset=".55" stop-color="#18cddd"/><stop offset="1" stop-color="#05798a"/></radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#b9c3cd"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="13" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
