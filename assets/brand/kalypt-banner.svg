<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 600" role="img" aria-labelledby="title desc">
  <title id="title">Kalypt — See what you're really sharing</title>
  <desc id="desc">Dark charcoal Kalypt banner with a cyan aperture symbol and wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081016"/><stop offset=".52" stop-color="#0c1117"/><stop offset="1" stop-color="#111821"/></linearGradient>
