    <text x="4" y="145" fill="#aeb8c4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="400" letter-spacing="6">See what you're <tspan fill="#32e6f2">really</tspan> sharing.</text>
